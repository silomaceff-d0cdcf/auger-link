# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache OFF: Chaquopy 15.x runs python3.11 --version during
# configuration which is incompatible with the configuration cache. Re-enable
# if Chaquopy upstream adds configuration-cache compatibility.
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Note: compileSdk 34 because that's what's installed on the Pi build host;
# bump to 35 once android-35 platform is sdkmanager-installed.
